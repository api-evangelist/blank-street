aid: blank-street
name: Blank Street
description: 'Blank Street is a consumer coffee and beverage retailer that began in 2020 as a single
  5x10 coffee cart in Brooklyn and has grown into a global brand operating roughly 90+ locations across
  the United States and the United Kingdom, serving seasonal specialty drinks such as matcha and espresso
  beverages. The company emphasizes convenience through mobile ordering and a loyalty rewards program
  via its consumer app, alongside merchandise and gifting. It is backed by General Catalyst and Tiger
  Global and was added to the API Evangelist network as a portfolio company. Blank Street publishes a
  consumer web and mobile experience (rewards, ordering, shop, locations, help center) but exposes no
  public developer API, SDK, or specification surface at this time; this profile captures its public web
  properties and domain-security posture.'
